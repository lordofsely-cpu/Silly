name: Build Sely APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract SelyApp ZIP
        shell: bash
        run: |
          if [ -f "SelyApp.zip" ]; then
            echo "SelyApp.zip found. Extracting..."
            unzip -o SelyApp.zip
          else
            echo "No SelyApp.zip found. Using existing project files."
          fi

          echo "Project files:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Check Gradle project
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 2 -type f \( -name "build.gradle" -o -name "settings.gradle" \) -print

      - name: Build Debug APK
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sely-build-${{ github.run_number }}
          name: Sely APK Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
